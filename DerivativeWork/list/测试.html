<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>未命名页面</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="1">
  <div class="theme-switch" role="group" aria-label="主题切换">
    <button type="button" class="theme-dot active" data-theme="1" title="默认主题" aria-label="默认主题"></button>
    <button type="button" class="theme-dot" data-theme="2" title="浅色主题" aria-label="浅色主题"></button>
    <button type="button" class="theme-dot" data-theme="3" title="深色主题" aria-label="深色主题"></button>
  </div>

  <div class="page">
    <h1 class="page-title">未命名页面</h1>

    <div class="desc">
      <p></p>
    </div>
    <div class="info-grid">
      <div class="info-item">
        <div class="info-name">伤害</div>
        <div class="info-value"></div>
      </div>
      <div class="info-item">
        <div class="info-name">伤害类型</div>
        <div class="info-value"></div>
      </div>
      <div class="info-item">
        <div class="info-name">攻速</div>
        <div class="info-value"></div>
      </div>
      <div class="info-item">
        <div class="info-name">射程</div>
        <div class="info-value"></div>
      </div>
      <div class="info-item">
        <div class="info-name">造价</div>
        <div class="info-value"></div>
      </div>
    </div>

    <section class="wiki-section">
      <h2>技能一</h2>
    </section>

    <section class="wiki-section">
      <h2>技能二</h2>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
