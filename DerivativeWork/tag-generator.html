<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tag生成器</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 24px 16px 60px;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: radial-gradient(circle at 15% 10%, #1e293b 0%, #0b1120 45%, #041f1e 100%);
    color: #e2e8f0;
  }
  .container { max-width: 820px; margin: 0 auto; }
  .card {
    padding: 24px; border-radius: 16px;
    background: rgba(15, 23, 42, 0.78);
    border: 1px solid rgba(148, 163, 184, 0.18);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(14px);
    margin-bottom: 20px;
  }
  h1 {
    margin: 0 0 8px; font-size: 20px;
    background: linear-gradient(90deg, #67e8f9, #a78bfa, #34d399);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tip { margin: 0 0 6px; font-size: 13px; color: #94a3b8; line-height: 1.7; }
  .tip:last-child { margin-bottom: 0; }
  .tip code {
    background: rgba(103, 232, 249, 0.12); color: #a5f3fc;
    padding: 1px 6px; border-radius: 4px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
  }
  label {
    display: block; font-size: 13px; color: #94a3b8;
    margin-bottom: 6px; font-weight: 500;
  }
  .req { color: #fda4af; font-weight: 700; margin-left: 2px; }
  input[type="text"], textarea {
    width: 100%; padding: 11px 14px; border-radius: 10px;
    border: 1px solid rgba(148, 163, 184, 0.22);
    background: #060c18; color: #e2e8f0;
    font-family: inherit; font-size: 14px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input[type="text"]:focus, textarea:focus {
    border-color: rgba(52, 211, 153, 0.55);
    box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.1);
  }
  input::placeholder, textarea::placeholder { color: #475569; }
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  /* 分类标签列表 */
  .tag-list { display: flex; flex-direction: column; gap: 8px; }
  .tag-row { display: flex; gap: 6px; align-items: center; }
  .tag-row input { flex: 1; }
  .tag-del {
    flex-shrink: 0; width: 34px; height: 34px;
    border: none; border-radius: 8px;
    background: rgba(190, 24, 93, 0.25); color: #fda4af;
    font-size: 16px; line-height: 1; cursor: pointer;
    font-family: inherit; transition: background .15s, color .15s;
  }
  .tag-del:hover { background: rgba(190, 24, 93, 0.7); color: #fff; }

  /* 类型选择 */
  .cat-bar { display: flex; flex-wrap: wrap; gap: 10px; }
  .cat-btn {
    flex: 1; min-width: 120px;
    border: 1px solid rgba(148, 163, 184, 0.28);
    background: rgba(6, 12, 24, 0.6);
    color: #94a3b8;
    font-size: 14px; padding: 14px 10px;
    border-radius: 10px; cursor: pointer;
    font-family: inherit; font-weight: 600;
    transition: transform .15s, background .2s, border-color .2s, color .2s, box-shadow .2s;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .cat-btn small {
    font-size: 11px; font-weight: 500; opacity: .8;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: .5px;
  }
  .cat-btn:hover {
    background: rgba(30, 41, 59, 0.8);
    border-color: rgba(148, 163, 184, 0.55);
    color: #e2e8f0;
  }
  .cat-btn.active {
    border-color: rgba(52, 211, 153, 0.8);
    background: linear-gradient(135deg, rgba(6, 182, 212, 0.22), rgba(16, 185, 129, 0.22));
    color: #fff;
    box-shadow: 0 6px 22px rgba(16, 185, 129, 0.25), inset 0 0 0 1px rgba(52, 211, 153, 0.4);
  }
  .cat-btn.active small { opacity: 1; color: #6ee7b7; }

  /* 按钮 */
  .bar { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .btn {
    border: 1px solid rgba(148, 163, 184, 0.3);
    background: rgba(51, 65, 85, 0.55); color: #e2e8f0;
    font-size: 13.5px; padding: 9px 18px; border-radius: 9px;
    cursor: pointer; font-family: inherit; white-space: nowrap;
    transition: transform .15s, box-shadow .2s, background .2s, border-color .2s;
  }
  .btn:hover {
    background: rgba(71, 85, 105, 0.85);
    border-color: rgba(148, 163, 184, 0.55);
    transform: translateY(-1px);
  }
  .btn:active { transform: translateY(0) scale(0.98); }
  .btn.primary {
    border: none; background: linear-gradient(135deg, #06b6d4, #7c3aed);
    color: #fff; font-weight: 600;
    box-shadow: 0 8px 24px rgba(56, 189, 248, 0.25);
  }
  .btn.primary:hover { box-shadow: 0 12px 30px rgba(124, 58, 237, 0.4); }
  .btn.success {
    border: none; background: linear-gradient(135deg, #059669, #10b981);
    color: #fff; font-weight: 600;
    box-shadow: 0 8px 24px rgba(16, 185, 129, 0.25);
  }
  .btn.success:hover { box-shadow: 0 12px 30px rgba(16, 185, 129, 0.4); }
  .btn.danger:hover {
    background: rgba(190, 24, 93, 0.35);
    border-color: rgba(244, 114, 182, 0.6);
  }
  .btn.sm { font-size: 12.5px; padding: 7px 14px; }
  .status {
    font-size: 12.5px; color: #64748b; flex: 1; min-width: 120px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }

  /* 输出 */
  .head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .counter {
    font-size: 12.5px; color: #64748b;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  #output {
    height: 90px; color: #a7f3d0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.7;
    white-space: pre-wrap; word-break: break-all;
  }
  .date-badge {
    display: inline-block;
    font-size: 12px; color: #67e8f9;
    background: rgba(8, 47, 73, 0.6);
    border: 1px solid rgba(103, 232, 249, 0.25);
    padding: 4px 10px; border-radius: 6px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }

  #toast {
    position: fixed; left: 50%; bottom: 100px;
    transform: translate(-50%, 20px);
    padding: 10px 22px; border-radius: 999px;
    background: rgba(15, 118, 110, 0.95); color: #ecfeff;
    font-size: 14px; opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45); z-index: 99;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 600px) {
    .card { padding: 18px; }
    .row2 { grid-template-columns: 1fr; }
    .cat-btn { min-width: calc(50% - 5px); flex: 1 1 calc(50% - 5px); padding: 12px 6px; font-size: 13px; }
    .bar .btn { flex: 1; font-size: 12.5px; padding: 9px 10px; }
    .status { width: 100%; flex: none; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="card">
    <h1>Tag生成器</h1>
    <p class="tip">填写下方信息，点击「生成代码」即可得到一行显示在作品标题下方的Tag。</p>
  </div>

  <div class="card">
    <label>类型<span class="req">*</span></label>
    <div class="cat-bar" id="catBar">
      <button class="cat-btn" type="button" data-cat="hero">英雄<small>hero</small></button>
      <button class="cat-btn" type="button" data-cat="tower">防御塔<small>tower</small></button>
      <button class="cat-btn" type="button" data-cat="enemy">敌人<small>enemy</small></button>
    </div>
  </div>


  <div class="card">
    <div class="field">
      <label>标题<span class="req">*</span></label>
      <input type="text" id="inTitle" placeholder="例如：火枪要塞" maxlength="60">
    </div>

    <div class="row2">
      <div class="field">
        <label>作者</label>
        <input type="text" id="inAuthor" placeholder="不填则为：匿名用户" maxlength="30">
      </div>
      <div class="field">
        <label>系列作品</label>
        <input type="text" id="inSeries" placeholder="不填则为：独立单元" maxlength="30">
      </div>
    </div>

    <div class="field" style="margin-bottom:0;">
      <label>分类标签（可选，可添加任意多个）</label>
      <div class="tag-list" id="tagList"></div>
      <div class="bar">
        <button class="btn sm" id="addTagBtn" type="button">+ 添加标签</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="field" style="margin-bottom:0;">
      <label>生成日期（自动取今天）</label>
      <span class="date-badge" id="dateBadge">—</span>
    </div>
  </div>

  <div class="card">
    <div class="bar" style="margin-top:0; margin-bottom:16px;">
      <button class="btn primary" id="genBtn" type="button">生成代码</button>
      <span class="status" id="status">就绪 · 请填写标题并选择类型</span>
    </div>

    <div class="head">
      <label style="margin:0;">生成结果</label>
      <span class="counter" id="count">0 字符</span>
    </div>
    <textarea id="output" spellcheck="false" placeholder="点击「生成代码」后，这里会出现一行可直接粘贴的对象代码……"></textarea>
    <div class="bar">
      <button class="btn success" id="copyBtn" type="button">复制代码</button>
      <button class="btn danger" id="clearBtn" type="button">清空结果</button>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
(function () {
  'use strict';

  function $(id) { return document.getElementById(id); }

  var inTitle   = $('inTitle');
  var inAuthor  = $('inAuthor');
  var inSeries  = $('inSeries');
  var tagList   = $('tagList');
  var catBar    = $('catBar');
  var dateBadge = $('dateBadge');
  var outputEl  = $('output');
  var statusEl  = $('status');
  var countEl   = $('count');
  var toastEl   = $('toast');

  var selectedCat = '';   // 当前选中的类型：tower / hero / enemy

  /* ---------- 提示 ---------- */
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  /* ---------- 日期 ---------- */
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  /* ---------- 字符串转义 ---------- */
  function jsStr(s) {
    return '"' + String(s)
      .replace(/\\/g, '\\\\')
      .replace(/"/g, '\\"')
      .replace(/\n/g, '\\n')
      .replace(/\r/g, '\\r')
      .replace(/\t/g, '\\t') + '"';
  }

  /* ---------- 分类标签行 ---------- */
  function addTagRow(value) {
    var row = document.createElement('div');
    row.className = 'tag-row';

    var inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'tag-input';
    inp.placeholder = '例如：奇幻 / 精英 / 对群';
    inp.maxLength = 30;
    inp.value = value || '';

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'tag-del';
    del.textContent = '×';
    del.title = '删除此标签';
    del.addEventListener('click', function () {
      row.remove();
      if (!tagList.children.length) addTagRow('');
    });

    row.appendChild(inp);
    row.appendChild(del);
    tagList.appendChild(row);
    return inp;
  }

  /* ---------- 类型按钮 ---------- */
  Array.prototype.forEach.call(catBar.querySelectorAll('.cat-btn'), function (btn) {
    btn.addEventListener('click', function () {
      selectedCat = btn.getAttribute('data-cat');
      Array.prototype.forEach.call(catBar.querySelectorAll('.cat-btn'), function (b) {
        b.classList.toggle('active', b === btn);
      });
    });
  });

  /* ---------- 收集标签 ---------- */
  function collectTags() {
    var tags = [];
    Array.prototype.forEach.call(tagList.querySelectorAll('.tag-input'), function (inp) {
      var v = inp.value.trim();
      if (v) tags.push(v);
    });
    return tags;
  }

  /* ---------- 生成 ---------- */
  function generate() {
    var title = inTitle.value.trim();
    if (!title) { toast('请填写标题'); inTitle.focus(); return; }
    if (!selectedCat) { toast('请选择类型'); return; }

    var author = inAuthor.value.trim() || '匿名用户';
    var series = inSeries.value.trim() || '独立单元';
    var extra  = collectTags();

    /* tags = [作者, 系列, ...分类标签] */
    var tags = [author, series].concat(extra);

    var time = todayStr();

    var line =
      '{ title: ' + jsStr(title) +
      ', tags: [' + tags.map(jsStr).join(', ') + ']' +
      ', category: ' + jsStr(selectedCat) +
      ', time: ' + jsStr(time) + ' },';

    outputEl.value = line;
    updateCount();

    statusEl.textContent = '已生成 · ' + time + ' · category=' + selectedCat;
    toast('代码已生成 ✓');
  }

  /* ---------- 字数 ---------- */
  function updateCount() {
    countEl.textContent = (outputEl.value.length || 0) + ' 字符';
  }

  /* ---------- 复制 ---------- */
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try {
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        ok ? resolve() : reject(new Error('fail'));
      } catch (e) {
        document.body.removeChild(ta);
        reject(e);
      }
    });
  }

  /* ---------- 事件 ---------- */
  $('addTagBtn').addEventListener('click', function () {
    var inp = addTagRow('');
    inp.focus();
  });

  $('genBtn').addEventListener('click', generate);

  $('copyBtn').addEventListener('click', function () {
    if (!outputEl.value) { toast('请先点击「生成代码」'); return; }
    copyText(outputEl.value).then(function () {
      toast('代码已复制到剪贴板 ✓');
    }).catch(function () {
      outputEl.focus(); outputEl.select();
      toast('复制失败，已全选，请按 Ctrl+C');
    });
  });

  $('clearBtn').addEventListener('click', function () {
    if (!outputEl.value) { toast('结果已经是空的'); return; }
    outputEl.value = '';
    updateCount();
    statusEl.textContent = '就绪 · 请填写标题并选择类型';
    toast('已清空结果');
  });

  outputEl.addEventListener('input', updateCount);

  /* 回车快捷生成 */
  [inTitle, inAuthor, inSeries].forEach(function (el) {
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); generate(); }
    });
  });

  /* ---------- 初始化 ---------- */
  dateBadge.textContent = todayStr();
  addTagRow('');
  updateCount();
})();
</script>
</body>
</html>
