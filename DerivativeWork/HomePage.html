    <button type="button" class="theme-dot" data-theme="2" title="浅色主题" aria-label="浅色主题"></button>
    <button type="button" class="theme-dot" data-theme="3" title="深色主题" aria-label="深色主题"></button>

    <h1 class="page-title title-center">欢迎来到王国保卫战自创百科</h1>

    <nav class="nav-list" aria-label="分类导航">
      <a class="nav-btn" data-key="hero" href="/DerivativeWork/list.html?type=hero">
